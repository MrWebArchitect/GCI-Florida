<!doctype html>
<html lang="en">
  {{> header/head title="Join Our Team"}}
  <body>
    <!-- Navbar -->
    {{> navbar/navbar configClassList=config.classes.navbar
    classList="border-bottom"}}
    <!-- /Navbar -->

    <!-- Careers Hero -->
    {{> widgets/careers-hero}}
    <!-- /Careers Hero-->

    <div
      class="offcanvas offcanvas-bottom careers-video"
      tabindex="-1"
      id="careersVideo"
      aria-labelledby="careersVideoLabel"
    >
      <div class="offcanvas-header">
        <div>
          <span class="subtitle-xs">Careers at Goode</span>
          <h2 class="h4 mb-0" id="careersVideoLabel">Join the Goode Team</h2>
        </div>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>

      <div class="offcanvas-body">
        <div class="ratio ratio-16x9">
          <iframe
            src="https://www.youtube.com/embed/JyTiCKw7fUo?si=pbe6dDKL5Pl2PV0B"
            title="GCF Now Hiring"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
            "
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    {{#each careers.jobs}}
    <div class="border p-3 m-3 jobs">
      <h2 class="career-title">
        <a href="javascript:void(0);" onclick="selectJob('{{title}}')"
          >{{title}}</a
        >
      </h2>
      <div class="d-flex">
        <div class="location"><i class="bi bi-geo-alt"></i>{{location}}</div>
        <i class="bi bi-dot mx-2"></i>
        <div class="hours primary-red">{{hours}}</div>
      </div>
    </div>
    {{/each}}

    <!-- Footer -->
    {{>footer/footer}}

    <script>
      function selectJob(jobTitle) {
        localStorage.setItem("selectedJobTitle", jobTitle);
        window.location.href = "job-description.html";
      }
    </script>
  </body>
</html>
